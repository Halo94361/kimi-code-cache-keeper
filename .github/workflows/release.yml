name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir -p .release/staging
          cp kimi.plugin.json package.json README.md AGENTS.md LICENSE .release/staging/
          cp -r commands skills dist .release/staging/
          # manifest 声明的每个 ./ 目录都必须进包，否则安装后 Skills 会报诊断错误
          for path in $(node -p 'const m=require("./kimi.plugin.json");[m.skills??[],m.commands??[]].flat().join("\n")'); do
            test -e ".release/staging/${path#./}" || { echo "缺少 manifest 声明的目录：$path"; exit 1; }
          done
          cd .release/staging
          zip -r "../cache-keeper-${GITHUB_REF_NAME#v}.zip" .
      - name: Publish release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ".release/cache-keeper-${GITHUB_REF_NAME#v}.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ".release/cache-keeper-${GITHUB_REF_NAME#v}.zip" \
              --title "$GITHUB_REF_NAME" \
              --notes "Cache Keeper ${GITHUB_REF_NAME}: ACP / Web REST 双模式保活、永久删除 fork、MCP 控制。"
          fi
